<html lang="zh-Hans">

<head>
    <meta charset="utf-8">
    <style>
        * {
            color: white;
            font-size: 2vw;
        }

        html {
            font-family: "helvetica neue", helvetica, arial, sans-serif;
        }

        body {
            background-color: #050525;
            padding: 0.5rem;
            background-repeat: no-repeat;
            background-position: bottom;
            background-size: 100%;
        }


        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th {
            border-bottom: 1px solid gray;
        }

        thead th:nth-child(1) {
            width: 30%;
        }

        thead th:nth-child(2) {
            width: 20%;
        }

        thead th:nth-child(3) {
            width: 15%;
        }

        thead th:nth-child(4) {
            width: 35%;
        }

        th,
        td {
            padding: 8px;
        }

        th,
        td {
            text-align: left;
        }

        tbody tr:nth-child(even) {
            background-color: #050545;
        }

        h2 {
            font-size: 1.5rem;
        }
        p {
            margin: 0.5rem;
        }

        img {
            width: 100%;
        }
    </style>
</head>

<body>
    <h2>操作方式</h2>
    <p>
        <table >
            <thead style="background-color: cadetblue;">
                <tr>
                    <th style="width: 25%;">操作</th>
                    <th style="width: 75%;">按键</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>旋转镜头</td>
                    <td>鼠标右键 + 拖动</td>
                </tr>
                <tr>
                    <td>平移镜头</td>
                    <td>鼠标中键 + 拖动</td>
                </tr>
                <tr>
                    <td>重置镜头</td>
                    <td>鼠标右键 + 鼠标左键</td>
                </tr>
                <tr>
                    <td>选择部件</td>
                    <td>在部件上单击鼠标左键</td>
                </tr>
                <tr>
                    <td>编辑部件</td>
                    <td>在部件上单击鼠标右键</td>
                </tr>
                <tr>
                    <td>移动部件</td>
                    <td>在部件上拖动</td>
                </tr>
                <tr>
                    <td>删除部件</td>
                    <td>Delete 键</td>
                </tr>
            </tbody>
        </table>
    </p>
</body>

</html>
