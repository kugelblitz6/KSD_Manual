<html lang="ko">

<head>
    <meta charset="utf-8">
    <style>
        * {
            color: white;
            font-size: 2vw;
        }

        html {
            font-family: "helvetica neue", helvetica, arial, sans-serif;
        }

        body {
            background-color: #050525;
            padding: 0.5rem;
            background-repeat: no-repeat;
            background-position: bottom;
            background-size: 100%;
        }


        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th {
            border-bottom: 1px solid gray;
        }

        thead th:nth-child(1) {
            width: 30%;
        }

        thead th:nth-child(2) {
            width: 20%;
        }

        thead th:nth-child(3) {
            width: 15%;
        }

        thead th:nth-child(4) {
            width: 35%;
        }

        th,
        td {
            padding: 8px;
        }

        th,
        td {
            text-align: left;
        }

        tbody tr:nth-child(even) {
            background-color: #050545;
        }

        h2 {
            font-size: 1.5rem;
        }
        p {
            margin: 0.5rem;
        }

        img {
            width: 100%;
        }
    </style>
</head>

<body>
    <h2>조작 방법</h2>
    <p>
        <table >
            <thead style="background-color: cadetblue;">
                <tr>
                    <th style="width: 25%;">조작</th>
                    <th style="width: 75%;">키</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>카메라 회전</td>
                    <td>오른쪽 버튼 + 드래그</td>
                </tr>
                <tr>
                    <td>카메라 이동</td>
                    <td>가운데 버튼 + 드래그</td>
                </tr>
                <tr>
                    <td>카메라 초기화</td>
                    <td>오른쪽 버튼 + 왼쪽 버튼</td>
                </tr>
                <tr>
                    <td>부품 선택</td>
                    <td>부품을 왼쪽 클릭</td>
                </tr>
                <tr>
                    <td>부품 편집</td>
                    <td>부품을 오른쪽 클릭</td>
                </tr>
                <tr>
                    <td>부품 이동</td>
                    <td>부품을 드래그</td>
                </tr>
                <tr>
                    <td>부품 삭제</td>
                    <td>Delete 키</td>
                </tr>
            </tbody>
        </table>
    </p>
</body>

</html>
