<html lang="ja">

<head>
    <meta charset="utf-8">
    <style>
        * {
            color: white;
            font-size: 2vw;
        }

        html {
            font-family: "helvetica neue", helvetica, arial, sans-serif;
        }

        body {
            background-color: #050525;
            padding: 0.5rem;
            background-repeat: no-repeat;
            background-position: bottom;
            background-size: 100%;
        }


        table {
            table-layout: fixed;
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th {
            border-bottom: 1px solid gray;
        }

        thead th:nth-child(1) {
            width: 30%;
        }

        thead th:nth-child(2) {
            width: 20%;
        }

        thead th:nth-child(3) {
            width: 15%;
        }

        thead th:nth-child(4) {
            width: 35%;
        }

        th,
        td {
            padding: 8px;
        }

        th,
        td {
            text-align: left;
        }

        tbody tr:nth-child(even) {
            background-color: #050545;
        }

        h2 {
            font-size: 1.5rem;
        }
        p {
            margin: 0.5rem;
        }

        img {
            width: 100%;
        }
    </style>
</head>

<body>
    <h2>操作方法</h2>
    <p>
        <table >
            <thead style="background-color: cadetblue;">
                <tr>
                    <th style="width: 25%;">操作</th>
                    <th style="width: 75%;">キー</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>カメラ回転</td>
                    <td>右ボタン＋ドラッグ</td>
                </tr>
                <tr>
                    <td>カメラ平行移動</td>
                    <td>中ボタン＋ドラッグ</td>
                </tr>
                <tr>
                    <td>カメラリセット</td>
                    <td>右ボタン＋左ボタン</td>
                </tr>
                <tr>
                    <td>パーツ選択</td>
                    <td>パーツを左クリック</td>
                </tr>
                <tr>
                    <td>パーツ編集</td>
                    <td>パーツを右クリック</td>
                </tr>
                <tr>
                    <td>パーツ移動</td>
                    <td>パーツをドラッグ</td>
                </tr>
                <tr>
                    <td>パーツ削除</td>
                    <td>Delete キー</td>
                </tr>
            </tbody>
        </table>
    </p>
</body>

</html>
